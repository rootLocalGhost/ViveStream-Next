name: Release
run-name: "ViveStream Release"

on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., 1.8.0). If omitted, automatically reads from VERSION file."
        required: false
        type: string
      previous_tag:
        description: "Previous tag to calculate changelog from (e.g., v1.7.0). If omitted, auto-detects previous git tag."
        required: false
        type: string

permissions:
  contents: write
  id-token: write # Required for OIDC token generation (Artifact Attestations)
  attestations: write # Required to write the attestation to GitHub

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build and Release App
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Versions Match
        id: version_check
        shell: bash
        run: |
          VERSION=$(cat VERSION | tr -d '\n\r ')
          PKG_VERSION=$(jq -r .version package.json)
          TAURI_VERSION=$(jq -r .version src-tauri/tauri.conf.json)

          echo "VERSION file: $VERSION"
          echo "package.json: $PKG_VERSION"
          echo "tauri.conf.json: $TAURI_VERSION"

          if [ "$VERSION" != "$PKG_VERSION" ] || [ "$VERSION" != "$TAURI_VERSION" ]; then
            echo "::error::Internal version mismatch detected! Check VERSION, package.json, and tauri.conf.json."
            exit 1
          fi

          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            CLEAN_INPUT_TAG="${INPUT_TAG#v}"
            if [ "$CLEAN_INPUT_TAG" != "$VERSION" ]; then
              echo "::error::Manual trigger tag (v$CLEAN_INPUT_TAG) does not match internal file versions (v$VERSION). Build aborted."
              exit 1
            fi
            echo "Manual tag verified against file versions."
          fi

          echo "app_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Auto-Generate and Push Git Tag
        shell: bash
        run: |
          VERSION="${{ steps.version_check.outputs.app_version }}"
          TAG_NAME="v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Creating local git tag: $TAG_NAME"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          else
            echo "Local tag $TAG_NAME already exists."
          fi

          echo "Ensuring tag is on remote..."
          git push origin "$TAG_NAME" || echo "Tag $TAG_NAME already exists on remote or concurrent push succeeded."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Release Notes
        id: generate_notes
        shell: bash
        run: |
          VERSION="${{ steps.version_check.outputs.app_version }}"
          INPUT_PREV_TAG="${{ github.event.inputs.previous_tag }}"

          if [ -n "$INPUT_PREV_TAG" ]; then
            PREV_TAG="$INPUT_PREV_TAG"
            echo "Using manually specified previous tag: $PREV_TAG"
          else
            # Try finding previous tag before current release
            PREV_TAG=$(git describe --tags --abbrev=0 "v$VERSION^" 2>/dev/null || git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            echo "Auto-detected previous tag: $PREV_TAG"
          fi

          if [ -n "$PREV_TAG" ]; then
            LOG_RANGE="$PREV_TAG..HEAD"
          else
            LOG_RANGE="-n 30"
          fi

          FEAT_LOG=""
          FIX_LOG=""
          UI_LOG=""
          PERF_LOG=""
          OTHER_LOG=""

          while IFS=$'\t' read -r hash subject; do
            [ -z "$hash" ] && continue
            commit_line="- ${subject} (\`${hash}\`)"
            
            case "$subject" in
              feat*|Feat*|add*|Add*)
                FEAT_LOG="${FEAT_LOG}${commit_line}"$'\n'
                ;;
              fix*|Fix*|bug*|Bug*|patch*|Patch*)
                FIX_LOG="${FIX_LOG}${commit_line}"$'\n'
                ;;
              ui*|UI*|style*|Style*|css*|CSS*|design*|Design*)
                UI_LOG="${UI_LOG}${commit_line}"$'\n'
                ;;
              perf*|Perf*|refactor*|Refactor*|core*|Core*|engine*|Engine*)
                PERF_LOG="${PERF_LOG}${commit_line}"$'\n'
                ;;
              *)
                OTHER_LOG="${OTHER_LOG}${commit_line}"$'\n'
                ;;
            esac
          done < <(git log $LOG_RANGE --pretty=format:"%h%x09%s")

          # If all categorized buckets are empty, fallback to simple log
          if [ -z "$FEAT_LOG" ] && [ -z "$FIX_LOG" ] && [ -z "$UI_LOG" ] && [ -z "$PERF_LOG" ]; then
            OTHER_LOG=$(git log $LOG_RANGE --pretty=format:"- %s (\`%h\`)")$'\n'
          fi

          echo "release_body<<EOF" >> $GITHUB_OUTPUT
          cat <<EON >> $GITHUB_OUTPUT
# 🚀 ViveStream Next \`v${VERSION}\`

> *A lightning-fast, native YouTube downloader & sleek local media library.* 🎬✨
EON

          if [ -n "$PREV_TAG" ]; then
            cat <<EON >> $GITHUB_OUTPUT
> 🔍 *Changelog calculated since tag \`${PREV_TAG}\`*
EON
          fi

          cat <<EON >> $GITHUB_OUTPUT

---

## 📦 What's New in this Release

EON

          if [ -n "$FEAT_LOG" ]; then
            cat <<EON >> $GITHUB_OUTPUT
### ✨ Features & Enhancements
$FEAT_LOG
EON
          fi

          if [ -n "$FIX_LOG" ]; then
            cat <<EON >> $GITHUB_OUTPUT
### 🐛 Bug Fixes & Improvements
$FIX_LOG
EON
          fi

          if [ -n "$UI_LOG" ]; then
            cat <<EON >> $GITHUB_OUTPUT
### 🎨 UI & Aesthetics Polish
$UI_LOG
EON
          fi

          if [ -n "$PERF_LOG" ]; then
            cat <<EON >> $GITHUB_OUTPUT
### ⚡ Performance & Core Engine
$PERF_LOG
EON
          fi

          if [ -n "$OTHER_LOG" ]; then
            cat <<EON >> $GITHUB_OUTPUT
### 🛠️ Other Changes & Maintenance
$OTHER_LOG
EON
          fi

          cat <<EON >> $GITHUB_OUTPUT
---

## 💻 Installation & Downloads

| Platform | Package | Architecture |
| :--- | :--- | :--- |
| **🪟 Windows** | \`vivestream-next_${VERSION}_x64-setup.exe\` | \`x86_64\` |
| **🐧 Linux (Debian/Ubuntu)** | \`vivestream-next_${VERSION}_amd64.deb\` | \`x86_64\` |
| **🐧 Arch Linux** | \`vivestream-next_${VERSION}_x86_64.pkg.tar.zst\` | \`x86_64\` |

---

> [!TIP]
> ### 🛡️ Security Notice (Unknown Publisher)
> **ViveStream** is a non-commercial open-source project. We do not purchase expensive enterprise code-signing certificates. Your operating system may flag the installer as coming from an *Unknown Publisher*.
>
> - **🪟 Windows**: Click **"More Info"** ➔ **"Run Anyway"** if Microsoft Defender SmartScreen prompts.
> - **🐧 Linux**: Right-click the binary ➔ *Properties* ➔ check **"Allow executing file as program"** (or \`chmod +x\`).

---

⌨️ **Pro Tip**: Press <kbd>?</kbd> anywhere in the app to open the interactive **Keyboard Shortcuts Cheat Sheet**! ⭐ If you like ViveStream, consider giving us a star on GitHub!
EON
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf squashfs-tools libfuse2 binutils zstd tar

      - name: Install frontend dependencies
        run: bun install

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.version_check.outputs.app_version }}
          releaseName: "ViveStream v${{ steps.version_check.outputs.app_version }}"
          releaseBody: ${{ steps.generate_notes.outputs.release_body }}
          releaseDraft: true
          prerelease: false

      - name: Generate Arch Linux Package (.pkg.tar.zst)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          DEB_FILE=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -n 1)
          if [ -z "$DEB_FILE" ]; then
            echo "::error::.deb package not found. Cannot generate Arch package."
            exit 1
          fi

          echo "Generating Arch package from $DEB_FILE..."
          mkdir arch_build
          cd arch_build
          ar x "../$DEB_FILE"
          tar -xf data.tar.*
          rm -f control.tar.* data.tar.* debian-binary

          SIZE=$(du -sb . | awk '{print $1}')

          cat <<EOT > .PKGINFO
          pkgname = vivestream-next-bin
          pkgbase = vivestream-next-bin
          pkgver = ${{ steps.version_check.outputs.app_version }}-1
          pkgdesc = A lightning-fast, natively integrated YouTube downloader and local media library.
          url = https://github.com/rootlocalghost/ViveStream-Next
          builddate = $(date +%s)
          packager = ViveStream CI <noreply@github.com>
          size = $SIZE
          arch = x86_64
          license = custom:PolyForm Noncommercial 1.0.0
          depend = webkit2gtk-4.1
          depend = yt-dlp
          depend = ffmpeg
          depend = intel-media-driver
          depend = libva-utils
          EOT

          ARCH_PKG_NAME="vivestream-next_${{ steps.version_check.outputs.app_version }}_x86_64.pkg.tar.zst"
          tar -c --zstd -f "../$ARCH_PKG_NAME" .

          gh release upload v${{ steps.version_check.outputs.app_version }} "../$ARCH_PKG_NAME" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest Build Provenance (Linux)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            src-tauri/target/release/bundle/deb/*.deb
            *.pkg.tar.zst

      - name: Attest Build Provenance (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "src-tauri/target/release/bundle/nsis/*.exe"
